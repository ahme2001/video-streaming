spring:
  application:
    name: video
  config:
    import: file:env.properties
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

server:
  port: 8081

aws:
  region: ${AWS_REGION}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # Uploaded originals; kept after packaging so a video can be re-packaged later
    video-prefix: videos/
    # Master playlist, media playlists and segments, one folder per video id
    hls-prefix: hls/


hls:
  # scratch space while packaging; each segment is uploaded to S3 and deleted as ffmpeg finishes it
  work-dir: hls-work/
  segment-duration-seconds: 4
  # the ladder a player picks from; the source is 360p, so nothing above it would add detail
  renditions:
    - name: 360p
      height: 360
      video-bitrate-kbps: 800
      audio-bitrate-kbps: 128
    - name: 240p
      height: 240
      video-bitrate-kbps: 400
      audio-bitrate-kbps: 96
  ffmpeg-binary: ffmpeg
  processing-timeout: 30m
  # ffmpeg PUTs each finished segment here and the app streams it on to S3
  ingest-base-url: http://127.0.0.1:${server.port}
  # a 4s segment is well under a megabyte at these bitrates; this is a safety valve
  max-ingest-bytes: 67108864
