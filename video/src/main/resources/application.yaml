spring:
  application:
    name: video
  config:
    import: file:env.properties
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

server:
  port: 8081

video:
  folder: videos/
  # upper bound on a single 206 response, so "bytes=0-" cannot pull a whole file into memory
  chunk-size-bytes: 1048576

hls:
  output-root: hls/
  # To save processing videos until finished and create all playlist
  staging-root: hls-staging/
  segment-duration-seconds: 4
  # the ladder a player picks from; the source is 360p, so nothing above it would add detail
  renditions:
    - name: 360p
      height: 360
      video-bitrate-kbps: 800
      audio-bitrate-kbps: 128
    - name: 240p
      height: 240
      video-bitrate-kbps: 400
      audio-bitrate-kbps: 96
  ffmpeg-binary: ffmpeg
  ffprobe-binary: ffprobe
  processing-timeout: 30m
